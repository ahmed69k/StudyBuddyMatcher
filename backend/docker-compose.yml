# Kafka (KRaft — no Zookeeper), same style as the lab: apache/kafka:3.7.2
# - 9092 -> PLAINTEXT; from other containers use bootstrap kafka:9092
# - 9094 -> CONTROLLER (internal to the container; not published)
services:
  kafka:
    image: apache/kafka:3.7.2
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9094
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

  user-and-auth-service:
    build: ./user-and-auth-service
    ports:
      # ORIGINAL: - "3000:3000"
      # EDIT: Host 3007 avoids bind errors when something (e.g. local node) already uses 3000; in-network URL stays :3000
      - "3007:3000"
    env_file:
      - ./user-and-auth-service/.env
    # EDIT: ensures gateway waits for auth readiness before schema stitching
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000', r=>process.exit(r.statusCode===200?0:1))"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ORIGINAL: PROFILE SERVICE NOT LISTED IN COMPOSE
  # EDIT: PROFILE SERVICE ADDED FOR GATEWAY / COMPOSE NETWORK
  profile-and-study-preferences-service:
    depends_on:
      - kafka
    build: ./profile-and-study-preferences-service
    ports:
      - "3001:3001"
    environment:
      KAFKA_BROKER: kafka:9092
      # ORIGINAL: NO PORT KEY HERE (ONLY KAFKA_BROKER)
      # EDIT: PORT MUST MATCH APP LISTEN PORT IN CONTAINER
      PORT: "3001"
    env_file:
      - ./profile-and-study-preferences-service/.env
    # EDIT: ensures gateway waits for profile readiness
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001', r=>process.exit(r.statusCode===200?0:1))"]
      interval: 5s
      timeout: 3s
      retries: 10

  notification-service:
    depends_on:
      - kafka
    build: ./notification-service/
    ports:
      - "3005:3005"
    environment:
      KAFKA_BROKER: kafka:9092
      PORT: "3005"
    env_file:
      - ./notification-service/.env
    # EDIT: FIX gateway missing notifications issue (stitch wait)
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3005', r=>process.exit(r.statusCode===200?0:1))"]
      interval: 5s
      timeout: 3s
      retries: 10

  matching-service:
    depends_on:
      - kafka
    build: ./matching-service
    ports:
      - "3003:3003"
    environment:
      KAFKA_BROKER: kafka:9092
      PORT: "3003"
    env_file:
      - path: ./matching-service/.env
        required: false
    # EDIT: gateway schema safety
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3003', r=>process.exit(r.statusCode===200?0:1))"]
      interval: 5s
      timeout: 3s
      retries: 10

  study-session-scheduling-service:
    depends_on:
      - kafka
    build: ./study-session-scheduling-service
    ports:
      - "3004:3004"
    environment:
      KAFKA_BROKER: kafka:9092
      PORT: "3004"
    env_file:
      - path: ./study-session-scheduling-service/.env
        required: false
    # EDIT: ensures stable stitching
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3004', r=>process.exit(r.statusCode===200?0:1))"]
      interval: 5s
      timeout: 3s
      retries: 10

  feedback-trust-service:
    depends_on:
      - kafka
      - study-session-scheduling-service
    build: ./feedback-trust-service
    ports:
      - "4010:4010"
    environment:
      KAFKA_BROKER: kafka:9092
      PORT: "4010"
    env_file:
      - path: ./feedback-trust-service/.env
        required: false
    # EDIT: gateway readiness guarantee
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4010', r=>process.exit(r.statusCode===200?0:1))"]
      interval: 5s
      timeout: 3s
      retries: 10

  messaging-service:
    build: ./messaging-service
    ports:
      - "8000:8000"
      - "8001:8001"
    env_file:
      - ./messaging-service/.env
    # EDIT: ensures messaging schema is ready before gateway stitch
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8000', r=>process.exit(r.statusCode===200?0:1))"]
      interval: 5s
      timeout: 3s
      retries: 10

  availability-management-service:
    depends_on:
      - kafka
    build: ./availability-management-service
    ports:
      - "3002:3002"
    environment:
      KAFKA_BROKER: kafka:9092
      PORT: "3002"
    env_file:
      - path: ./availability-management-service/.env
        required: false
    # EDIT: required for stable gateway schema stitching
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3002', r=>process.exit(r.statusCode===200?0:1))"]
      interval: 5s
      timeout: 3s
      retries: 10

  graphql-gateway:
    build: ./graphql-gateway
    ports:
      - "4001:4001"

    # EDIT: CRITICAL FIX — wait for ALL services to actually be ready
    depends_on:
      user-and-auth-service:
        condition: service_healthy
      profile-and-study-preferences-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
      matching-service:
        condition: service_healthy
      availability-management-service:
        condition: service_healthy
      study-session-scheduling-service:
        condition: service_healthy
      feedback-trust-service:
        condition: service_healthy
      messaging-service:
        condition: service_healthy

    environment:
      PORT: "4001"
      # Service hostname + container listen port (3000). Host browser: http://localhost:3007/
      AUTH_GRAPHQL_URL: http://user-and-auth-service:3000/
      PROFILE_GRAPHQL_URL: http://profile-and-study-preferences-service:3001/
      NOTIFICATION_GRAPHQL_URL: http://notification-service:3005/
      MATCHING_GRAPHQL_URL: http://matching-service:3003/
      AVAILABILITY_GRAPHQL_URL: http://availability-management-service:3002/
      STUDY_SESSION_GRAPHQL_URL: http://study-session-scheduling-service:3004/
      FEEDBACK_TRUST_GRAPHQL_URL: http://feedback-trust-service:4010/
      MESSAGING_GRAPHQL_URL: http://messaging-service:8000/