# Kafka (KRaft — no Zookeeper), same style as the lab: apache/kafka:3.7.2
# - 9092 -> PLAINTEXT; from other containers use bootstrap kafka:9092
# - 9094 -> CONTROLLER (internal to the container; not published)
services:
  kafka:
    image: apache/kafka:3.7.2
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9094
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

  user-and-auth-service:
    build: ./user-and-auth-service
    ports:
      # -- change menna — host mapping (rollback: comment out next line, uncomment ORIGINAL)
      # ORIGINAL: - "3000:3000"
      # EDIT: Host 3007 avoids bind errors when something (e.g. local node) already uses 3000; in-network URL stays :3000
      - "3007:3000"
    env_file:
      - ./user-and-auth-service/.env
    # EDIT: ensures gateway waits for auth readiness before schema stitching
    # Apollo rejects bare GET /; probe a trivial GraphQL GET + CSRF header (see Apollo CSRF prevention).
    # -- change menna — healthcheck (rollback: comment out the 5 active lines below, uncomment ORIGINAL block)
    healthcheck:
      # ORIGINAL healthcheck (menna — delete # prefixes on these 4 lines to revert; comment out active test/interval/timeout/retries/start_period below):
      # test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000', r=>process.exit(r.statusCode===200?0:1))"]
      # interval: 5s
      # timeout: 3s
      # retries: 10
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/?query=%7B__typename%7D',{headers:{'apollo-require-preflight':'true'}},r=>{r.resume();process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 45s

  # ORIGINAL: PROFILE SERVICE NOT LISTED IN COMPOSE
  # EDIT: PROFILE SERVICE ADDED FOR GATEWAY / COMPOSE NETWORK
  # -- change menna — entire profile-and-study-preferences-service block added (rollback: comment out whole service from name through its healthcheck end, before notification-service)
  profile-and-study-preferences-service:
    depends_on:
      - kafka
    build: ./profile-and-study-preferences-service
    ports:
      - "3001:3001"
    environment:
      KAFKA_BROKER: kafka:9092
      # -- change menna — PORT in environment (rollback: comment out next line if app used default-only)
      # ORIGINAL: NO PORT KEY HERE (ONLY KAFKA_BROKER)
      # EDIT: PORT MUST MATCH APP LISTEN PORT IN CONTAINER
      PORT: "3001"
    env_file:
      - ./profile-and-study-preferences-service/.env
    # EDIT: ensures gateway waits for profile readiness
    # -- change menna — healthcheck (rollback: comment active 5 lines, uncomment ORIGINAL block)
    healthcheck:
      # ORIGINAL healthcheck (menna):
      # test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001', r=>process.exit(r.statusCode===200?0:1))"]
      # interval: 5s
      # timeout: 3s
      # retries: 10
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3001/?query=%7B__typename%7D',{headers:{'apollo-require-preflight':'true'}},r=>{r.resume();process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 45s

  notification-service:
    depends_on:
      - kafka
    build: ./notification-service/
    ports:
      - "3005:3005"
    environment:
