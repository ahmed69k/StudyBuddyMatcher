      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3005/?query=%7B__typename%7D',{headers:{'apollo-require-preflight':'true'}},r=>{r.resume();process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))"]
